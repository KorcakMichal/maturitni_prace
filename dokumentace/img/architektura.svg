<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="920" height="470" fill="#ffffff"/>

  <!-- Aplikace -->
  <rect x="235" y="25" width="410" height="420" rx="10" fill="#f5f9ff" stroke="#1e6fd9" stroke-width="2" stroke-dasharray="7 4"/>
  <text x="250" y="48" font-weight="bold" fill="#1e6fd9">Aplikace (src/)</text>

  <!-- Uživatel -->
  <rect x="30" y="160" width="160" height="80" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="110" y="195" text-anchor="middle" font-weight="bold" fill="#263238">Uživatel</text>
  <text x="110" y="215" text-anchor="middle" fill="#455a64">+ čtečka kódů</text>

  <!-- main.py -->
  <rect x="300" y="65" width="280" height="55" rx="8" fill="#e3f2fd" stroke="#1e6fd9" stroke-width="2"/>
  <text x="440" y="90" text-anchor="middle" font-weight="bold" fill="#263238">main.py</text>
  <text x="440" y="108" text-anchor="middle" fill="#455a64" font-size="13">řízení toku, hlášení výsledku</text>

  <!-- screen.py -->
  <rect x="255" y="175" width="170" height="85" rx="8" fill="#e3f2fd" stroke="#1e6fd9" stroke-width="2"/>
  <text x="340" y="203" text-anchor="middle" font-weight="bold" fill="#263238">screen.py</text>
  <text x="340" y="222" text-anchor="middle" fill="#455a64" font-size="13">Tkinter UI</text>
  <text x="340" y="240" text-anchor="middle" fill="#455a64" font-size="13">sestavit() – validace</text>

  <!-- forms.py -->
  <rect x="455" y="175" width="170" height="85" rx="8" fill="#e3f2fd" stroke="#1e6fd9" stroke-width="2"/>
  <text x="540" y="203" text-anchor="middle" font-weight="bold" fill="#263238">forms.py</text>
  <text x="540" y="222" text-anchor="middle" fill="#455a64" font-size="13">Playwright</text>
  <text x="540" y="240" text-anchor="middle" fill="#455a64" font-size="13">odeslat() – vyplní Forms</text>

  <!-- schemas.py -->
  <rect x="255" y="335" width="370" height="75" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="440" y="363" text-anchor="middle" font-weight="bold" fill="#263238">schemas.py</text>
  <text x="440" y="383" text-anchor="middle" fill="#455a64" font-size="13">Pydantic modely Meridlo a Kalibrace</text>
  <text x="440" y="399" text-anchor="middle" fill="#455a64" font-size="13">jediný zdroj pravdy o polích a pravidlech</text>

  <!-- Konfigurace -->
  <rect x="700" y="30" width="190" height="70" rx="8" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
  <text x="795" y="58" text-anchor="middle" font-weight="bold" fill="#263238">.env + auth/</text>
  <text x="795" y="78" text-anchor="middle" fill="#455a64" font-size="13">FORM_URL, uložené přihlášení</text>

  <!-- Chromium -->
  <rect x="700" y="160" width="190" height="70" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="795" y="188" text-anchor="middle" font-weight="bold" fill="#263238">Chromium</text>
  <text x="795" y="208" text-anchor="middle" fill="#455a64" font-size="13">ovládaný přes Playwright</text>

  <!-- Forms -->
  <rect x="700" y="270" width="190" height="55" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="795" y="294" text-anchor="middle" font-weight="bold" fill="#263238">Microsoft Forms</text>
  <text x="795" y="312" text-anchor="middle" fill="#455a64" font-size="13">formulář kalibrace</text>

  <!-- SharePoint -->
  <rect x="700" y="365" width="190" height="60" rx="8" fill="#eceff1" stroke="#546e7a" stroke-width="2"/>
  <text x="795" y="391" text-anchor="middle" font-weight="bold" fill="#263238">SharePoint</text>
  <text x="795" y="410" text-anchor="middle" fill="#455a64" font-size="13">seznam TableAction</text>

  <!-- Šipky -->
  <g stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#a)">
    <!-- uživatel -> screen -->
    <path d="M190,200 H255"/>
    <!-- main -> screen, forms -->
    <path d="M370,120 V175"/>
    <path d="M510,120 V175"/>
    <!-- forms -> chromium -->
    <path d="M625,217 H700"/>
    <!-- chromium -> forms -> SP -->
    <path d="M795,230 V270"/>
    <path d="M795,325 V365"/>
  </g>
  <!-- závislost na schématu -->
  <g stroke="#2e7d32" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)">
    <path d="M340,260 V335"/>
    <path d="M540,260 V335"/>
  </g>
  <!-- konfigurace -> chromium -->
  <g stroke="#8e24aa" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#a)">
    <path d="M795,100 V160"/>
  </g>

  <!-- Popisky šipek -->
  <g fill="#455a64" font-size="12">
    <text x="222" y="190" text-anchor="middle">kódy, hodnoty</text>
    <text x="364" y="150" text-anchor="end">1. nacist_kalibrace()</text>
    <text x="516" y="150">2. odeslat()</text>
    <text x="350" y="302">import</text>
    <text x="550" y="302">import</text>
  </g>
</svg>
